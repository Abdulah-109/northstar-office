<!DOCTYPE html>
<html lang="de" class="h-full bg-[#F5F1E8] text-[#34312D]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Northstar – Mac Desktop Edition v4.0</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client for Cloud Sync -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            mac: {
              bg: '#F5F1E8',
              sidebar: '#EAE2D5',
              window: '#FFFDF8',
              border: '#DED5C8',
              accent: '#C8B69B',
              accentHover: '#B5A182',
              text: '#34312D',
              muted: '#81796F',
              dock: 'rgba(234, 226, 213, 0.85)'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #F5F1E8;
      color: #34312D;
      user-select: none;
    }
    input, textarea, select {
      user-select: text;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #DED5C8; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #C8B69B; }
    
    .mac-window {
      box-shadow: 0 20px 40px -15px rgba(52, 49, 45, 0.15), 0 0 0 1px rgba(222, 213, 200, 0.6);
      backdrop-filter: blur(20px);
    }
    .dock-glass {
      background: rgba(234, 226, 213, 0.82);
      backdrop-filter: blur(25px);
      box-shadow: 0 10px 30px rgba(52, 49, 45, 0.12), 0 0 0 1px rgba(222, 213, 200, 0.5);
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden antialiased selection:bg-[#C8B69B] selection:text-white">

  <!-- macOS TOP MENU BAR -->
  <header class="h-8 bg-[#EAE2D5]/90 border-b border-[#DED5C8] flex items-center justify-between px-4 z-50 text-xs font-medium select-none shrink-0">
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-1.5 font-bold text-[#34312D] cursor-pointer" onclick="openApp('dashboard')">
        <span class="w-3 h-3 rounded-full bg-[#C8B69B] inline-block"></span>
        <span>Northstar</span>
      </div>
      <span class="text-[#81796F] hidden sm:inline" id="topbar-active-app">Dashboard</span>
    </div>
    
    <div class="flex items-center gap-4 text-[#34312D]">
      <div id="sync-status-indicator" class="flex items-center gap-1.5 text-[11px] text-[#81796F]" title="Cloud Sync Status">
        <i data-lucide="cloud-off" class="w-3.5 h-3.5"></i>
        <span class="hidden md:inline">Lokal</span>
      </div>
      <div class="flex items-center gap-2">
        <i data-lucide="wifi" class="w-3.5 h-3.5 text-[#81796F]"></i>
        <i data-lucide="battery" class="w-4 h-4 text-[#81796F]"></i>
        <span id="topbar-clock">00:00</span>
      </div>
    </div>
  </header>

  <!-- DESKTOP WORKSPACE AREA -->
  <div id="desktop-area" class="flex-1 relative overflow-hidden flex flex-col md:flex-row">

    <!-- DESKTOP APP ICONS GRID (Background layer) -->
    <div class="absolute inset-6 grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-6 content-start z-0 pointer-events-none select-none">
      <div onclick="openApp('finder')" class="flex flex-col items-center gap-1.5 cursor-pointer pointer-events-auto group">
        <div class="w-14 h-14 rounded-2xl bg-[#FFFDF8] border border-[#DED5C8] shadow-sm flex items-center justify-center text-[#C8B69B] group-hover:scale-105 transition">
          <i data-lucide="folder" class="w-7 h-7"></i>
        </div>
        <span class="text-[11px] font-medium text-[#34312D] bg-[#F5F1E8]/80 px-2 py-0.5 rounded shadow-2xs">Finder</span>
      </div>

      <div onclick="openApp('lernen')" class="flex flex-col items-center gap-1.5 cursor-pointer pointer-events-auto group">
        <div class="w-14 h-14 rounded-2xl bg-[#FFFDF8] border border-[#DED5C8] shadow-sm flex items-center justify-center text-[#C8B69B] group-hover:scale-105 transition">
          <i data-lucide="graduation-cap" class="w-7 h-7"></i>
        </div>
        <span class="text-[11px] font-medium text-[#34312D] bg-[#F5F1E8]/80 px-2 py-0.5 rounded shadow-2xs">Lernen</span>
      </div>

      <div onclick="openApp('donna')" class="flex flex-col items-center gap-1.5 cursor-pointer pointer-events-auto group">
        <div class="w-14 h-14 rounded-2xl bg-[#FFFDF8] border border-[#DED5C8] shadow-sm flex items-center justify-center text-[#C8B69B] group-hover:scale-105 transition">
          <i data-lucide="sparkles" class="w-7 h-7 text-[#C8B69B]"></i>
        </div>
        <span class="text-[11px] font-medium text-[#34312D] bg-[#F5F1E8]/80 px-2 py-0.5 rounded shadow-2xs">Donna</span>
      </div>
    </div>

    <!-- MAIN APP WINDOW CONTAINER -->
    <div id="window-container" class="absolute inset-4 md:inset-6 z-10 flex flex-col pointer-events-none">
      <!-- Dynamic Windows injected here -->
    </div>

  </div>

  <!-- macOS DOCK -->
  <nav class="h-16 dock-glass border-t border-[#DED5C8] flex items-center justify-center px-4 z-40 shrink-0">
    <div class="flex items-center gap-2 md:gap-3 px-3 py-1.5 rounded-2xl bg-[#FFFDF8]/60 border border-[#DED5C8]/80 shadow-md">
      
      <button onclick="openApp('dashboard')" class="group relative p-2 rounded-xl hover:bg-[#EAE2D5] transition active:scale-95" title="Dashboard">
        <i data-lucide="layout-dashboard" class="w-6 h-6 text-[#34312D]"></i>
        <span class="absolute -top-8 left-1/2 -translate-x-1/2 bg-[#34312D] text-white text-[10px] px-2 py-0.5 rounded opacity-0 group-hover:opacity-100 transition pointer-events-none whitespace-nowrap">Dashboard</span>
      </button>

      <button onclick="openApp('finder')" class="group relative p-2 rounded-xl hover:bg-[#EAE2D5] transition active:scale-95" title="Finder">
        <i data-lucide="folder" class="w-6 h-6 text-[#34312D]"></i>
        <span class="absolute -top-8 left-1/2 -translate-x-1/2 bg-[#34312D] text-white text-[10px] px-2 py-0.5 rounded opacity-0 group-hover:opacity-100 transition pointer-events-none whitespace-nowrap">Finder</span>
      </button>

      <button onclick="openApp('kalender')" class="group relative p-2 rounded-xl hover:bg-[#EAE2D5] transition active:scale-95" title="Kalender">
        <i data-lucide="calendar" class="w-6 h-6 text-[#34312D]"></i>
        <span class="absolute -top-8 left-1/2 -translate-x-1/2 bg-[#34312D] text-white text-[10px] px-2 py-0.5 rounded opacity-0 group-hover:opacity-100 transition pointer-events-none whitespace-nowrap">Kalender</span>
      </button>

      <button onclick="openApp('erinnerungen')" class="group relative p-2 rounded-xl hover:bg-[#EAE2D5] transition active:scale-95" title="Erinnerungen">
        <i data-lucide="check-square" class="w-6 h-6 text-[#34312D]"></i>
        <span class="absolute -top-8 left-1/2 -translate-x-1/2 bg-[#34312D] text-white text-[10px] px-2 py-0.5 rounded opacity-0 group-hover:opacity-100 transition pointer-events-none whitespace-nowrap">Erinnerungen</span>
      </button>

      <button onclick="openApp('notizen')" class="group relative p-2 rounded-xl hover:bg-[#EAE2D5] transition active:scale-95" title="Notizen">
        <i data-lucide="file-text" class="w-6 h-6 text-[#34312D]"></i>
        <span class="absolute -top-8 left-1/2 -translate-x-1/2 bg-[#34312D] text-white text-[10px] px-2 py-0.5 rounded opacity-0 group-hover:opacity-100 transition pointer-events-none whitespace-nowrap">Notizen</span>
      </button>

      <button onclick="openApp('lernen')" class="group relative p-2 rounded-xl hover:bg-[#EAE2D5] transition active:scale-95" title="Lernen">
        <i data-lucide="graduation-cap" class="w-6 h-6 text-[#34312D]"></i>
        <span class="absolute -top-8 left-1/2 -translate-x-1/2 bg-[#34312D] text-white text-[10px] px-2 py-0.5 rounded opacity-0 group-hover:opacity-100 transition pointer-events-none whitespace-nowrap">Lernen</span>
      </button>

      <button onclick="openApp('donna')" class="group relative p-2 rounded-xl hover:bg-[#EAE2D5] transition active:scale-95" title="Donna">
        <i data-lucide="sparkles" class="w-6 h-6 text-[#C8B69B]"></i>
        <span class="absolute -top-8 left-1/2 -translate-x-1/2 bg-[#34312D] text-white text-[10px] px-2 py-0.5 rounded opacity-0 group-hover:opacity-100 transition pointer-events-none whitespace-nowrap">Donna</span>
      </button>

      <button onclick="openApp('rechner')" class="group relative p-2 rounded-xl hover:bg-[#EAE2D5] transition active:scale-95" title="Rechner">
        <i data-lucide="calculator" class="w-6 h-6 text-[#34312D]"></i>
        <span class="absolute -top-8 left-1/2 -translate-x-1/2 bg-[#34312D] text-white text-[10px] px-2 py-0.5 rounded opacity-0 group-hover:opacity-100 transition pointer-events-none whitespace-nowrap">Rechner</span>
      </button>

      <div class="w-px h-6 bg-[#DED5C8] mx-1"></div>

      <button onclick="openApp('einstellungen')" class="group relative p-2 rounded-xl hover:bg-[#EAE2D5] transition active:scale-95" title="Einstellungen">
        <i data-lucide="settings" class="w-6 h-6 text-[#34312D]"></i>
        <span class="absolute -top-8 left-1/2 -translate-x-1/2 bg-[#34312D] text-white text-[10px] px-2 py-0.5 rounded opacity-0 group-hover:opacity-100 transition pointer-events-none whitespace-nowrap">Einstellungen</span>
      </button>

    </div>
  </nav>

  <!-- JAVASCRIPT APP LOGIC -->
  <script>
    // CORE APPLICATION STATE
    let appState = {
      theme: { bg: '#F5F1E8', sidebar: '#EAE2D5', window: '#FFFDF8', text: '#34312D', accent: '#C8B69B' },
      supabase: { url: '', key: '', active: false },
      subjects: [
        { id: 1, name: "IT-Systeme", topics: [{ id: 101, title: "Wasserfallmodell", notes: "Lineares Vorgehensmodell.", subtopics: [{ id: 1001, title: "Analyse", status: "Verstanden" }] }] },
        { id: 2, name: "BWL", topics: [] },
        { id: 3, name: "Französisch", topics: [] },
        { id: 4, name: "Deutsch", topics: [] },
        { id: 5, name: "Mathematik", topics: [] }
      ],
      tasks: [
        { id: 1, title: "Hausaufgaben BWL machen", category: "Schule", date: "2026-11-04", completed: false }
      ],
      calendar: [
        { id: 1, title: "Klausur IT-Systeme", date: "2026-11-10", type: "Prüfung" }
      ],
      notes: [
        { id: 1, title: "Wichtige Formeln", content: "Break-Even = Fixkosten / (Preis - vK)", folder: "Fachabi" }
      ],
      folders: ["Fachabi", "BWL", "IT-Systeme", "Französisch", "Privat"],
      donnaMessages: [
        { sender: 'donna', text: "Guten Tag, Boss. Ich bin Donna. Ich verwalte deine Termine, Aufgaben und helfe dir beim Fachabi. Was machen wir als Erstes?" }
      ]
    };

    let activeWindows = {};

    document.addEventListener("DOMContentLoaded", function() {
      loadLocalStorage();
      initClock();
      openApp('dashboard');
      lucide.createIcons();
    });

    function loadLocalStorage() {
      const saved = localStorage.getItem("northstar_mac_v4_data");
      if (saved) {
        try { appState = JSON.parse(saved); } catch(e) {}
      }
    }

    function saveLocalStorage() {
      localStorage.setItem("northstar_mac_v4_data", JSON.stringify(appState));
      syncWithSupabase();
    }

    function initClock() {
      setInterval(() => {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        document.getElementById("topbar-clock").innerText = timeStr;
      }, 1000);
    }

    // WINDOW MANAGER
    function openApp(appId) {
      document.getElementById("topbar-active-app").innerText = appId.charAt(0).toUpperCase() + appId.slice(1);
      
      const container = document.getElementById("window-container");
      container.innerHTML = ""; // Single window active for clean macOS focus or multi-window

      const win = document.createElement("div");
      win.className = "mac-window absolute inset-0 md:inset-x-12 md:inset-y-6 bg-[#FFFDF8] rounded-2xl border border-[#DED5C8] flex flex-col pointer-events-auto overflow-hidden animate-in fade-in zoom-in-95 duration-150";
      
      win.innerHTML = `
        <!-- Window TitleBar -->
        <div class="h-11 bg-[#EAE2D5]/80 border-b border-[#DED5C8] flex items-center justify-between px-4 select-none shrink-0">
          <div class="flex items-center gap-2">
            <button onclick="closeActiveWindow()" class="w-3.5 h-3.5 rounded-full bg-rose-500 hover:bg-rose-600 border border-rose-600 flex items-center justify-center text-[8px] text-white font-bold">&times;</button>
            <button onclick="minimizeWindow()" class="w-3.5 h-3.5 rounded-full bg-amber-400 hover:bg-amber-500 border border-amber-500"></button>
            <button onclick="maximizeWindow()" class="w-3.5 h-3.5 rounded-full bg-emerald-500 hover:bg-emerald-600 border border-emerald-600"></button>
            <span class="ml-2 text-xs font-bold text-[#34312D] uppercase tracking-wider">${appId}</span>
          </div>
          <div class="text-xs text-[#81796F] font-medium">Northstar macOS</div>
        </div>

        <!-- Window Content Body -->
        <div class="flex-1 overflow-y-auto p-4 md:p-6 bg-[#FFFDF8]" id="app-content-body">
          ${renderAppContent(appId)}
        </div>
      `;

      container.appendChild(win);
      lucide.createIcons();
    }

    function closeActiveWindow() {
      document.getElementById("window-container").innerHTML = "";
      document.getElementById("topbar-active-app").innerText = "Desktop";
    }

    function minimizeWindow() {
      document.getElementById("window-container").innerHTML = "";
    }

    function maximizeWindow() {
      // Toggle fullscreen feel
    }

    // APP CONTENT RENDERER
    function renderAppContent(appId) {
      switch(appId) {
        case 'dashboard':
          return `
            <div class="space-y-6">
              <div class="p-6 rounded-2xl bg-[#F5F1E8] border border-[#DED5C8] flex justify-between items-center">
                <div>
                  <h2 class="text-2xl font-black text-[#34312D]">Guten Tag, Boss.</h2>
                  <p class="text-xs text-[#81796F] mt-1">Dein persönlicher Arbeitsplatz ist bereit.</p>
                </div>
                <button onclick="openApp('donna')" class="px-4 py-2.5 bg-[#C8B69B] text-white rounded-xl text-xs font-bold flex items-center gap-2">
                  <i data-lucide="sparkles" class="w-4 h-4"></i> Donna fragen
                </button>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="p-4 rounded-xl bg-[#F5F1E8] border border-[#DED5C8]">
                  <p class="text-xs font-bold text-[#81796F]">Offene Aufgaben</p>
                  <p class="text-2xl font-black text-[#34312D] mt-1">${appState.tasks.filter(t=>!t.completed).length}</p>
                </div>
                <div class="p-4 rounded-xl bg-[#F5F1E8] border border-[#DED5C8]">
                  <p class="text-xs font-bold text-[#81796F]">Anstehende Termine</p>
                  <p class="text-2xl font-black text-[#34312D] mt-1">${appState.calendar.length}</p>
                </div>
                <div class="p-4 rounded-xl bg-[#F5F1E8] border border-[#DED5C8]">
                  <p class="text-xs font-bold text-[#81796F]">Notizen</p>
                  <p class="text-2xl font-black text-[#34312D] mt-1">${appState.notes.length}</p>
                </div>
              </div>
            </div>
          `;

        case 'finder':
          return `
            <div class="space-y-4">
              <div class="flex justify-between items-center border-b border-[#DED5C8] pb-3">
                <h3 class="text-lg font-bold text-[#34312D]">Finder & Dokumente</h3>
                <button onclick="promptNewNote()" class="px-3 py-1.5 bg-[#C8B69B] text-white rounded-xl text-xs font-bold">+ Neue Notiz</button>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="space-y-1 bg-[#F5F1E8] p-3 rounded-xl border border-[#DED5C8]">
                  <p class="text-xs font-bold text-[#81796F] mb-2 uppercase">Ordner</p>
                  ${appState.folders.map(f => `<div class="p-2 text-xs font-semibold rounded hover:bg-[#FFFDF8] cursor-pointer">${f}</div>`).join('')}
                </div>
                <div class="md:col-span-3 space-y-2">
                  <p class="text-xs font-bold text-[#81796F] uppercase">Dateien</p>
                  ${appState.notes.map(n => `
                    <div class="p-3 rounded-xl bg-[#F5F1E8] border border-[#DED5C8] flex justify-between items-center text-xs">
                      <div>
                        <p class="font-bold text-[#34312D]">${n.title}</p>
                        <p class="text-[#81796F] text-[11px]">${n.content}</p>
                      </div>
                      <span class="px-2 py-0.5 bg-[#EAE2D5] rounded text-[10px] font-bold">${n.folder}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          `;

        case 'erinnerungen':
        case 'aufgaben':
          return `
            <div class="space-y-4">
              <h3 class="text-lg font-bold text-[#34312D]">Aufgaben & Erinnerungen</h3>
              <div class="flex gap-2">
                <input type="text" id="new-task-input" placeholder="Neue Aufgabe..." class="flex-1 bg-[#F5F1E8] border border-[#DED5C8] rounded-xl px-3.5 py-2 text-xs">
                <button onclick="addTaskFromApp()" class="px-4 py-2 bg-[#C8B69B] text-white rounded-xl text-xs font-bold">Hinzufügen</button>
              </div>
              <div class="space-y-2">
                ${appState.tasks.map(t => `
                  <div class="p-3 rounded-xl bg-[#F5F1E8] border border-[#DED5C8] flex justify-between items-center text-xs">
                    <span class="${t.completed ? 'line-through text-[#81796F]' : 'font-bold text-[#34312D]'}">${t.title} (${t.category})</span>
                    <button onclick="toggleTask(${t.id})" class="px-2.5 py-1 rounded bg-[#EAE2D5] font-bold">${t.completed ? 'Erledigt' : 'Offen'}</button>
                  </div>
                `).join('')}
              </div>
            </div>
          `;

        case 'kalender':
          return `
            <div class="space-y-4">
              <h3 class="text-lg font-bold text-[#34312D]">Kalender & Termine</h3>
              <div class="space-y-2">
                ${appState.calendar.map(c => `
                  <div class="p-3 rounded-xl bg-[#F5F1E8] border border-[#DED5C8] flex justify-between items-center text-xs">
                    <span class="font-bold text-[#34312D]">${c.title}</span>
                    <span class="text-[#81796F] font-semibold">${c.date}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `;

        case 'notizen':
          return `
            <div class="space-y-4">
              <h3 class="text-lg font-bold text-[#34312D]">Notizen</h3>
              <textarea rows="12" class="w-full bg-[#F5F1E8] border border-[#DED5C8] rounded-xl p-4 text-xs font-mono" placeholder="Schreibe deine Gedanken hier..."></textarea>
            </div>
          `;

        case 'lernen':
          return `
            <div class="space-y-4">
              <h3 class="text-lg font-bold text-[#34312D]">School Office & Fachabi</h3>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                ${appState.subjects.map(s => `
                  <div class="p-4 rounded-xl bg-[#F5F1E8] border border-[#DED5C8] space-y-2">
                    <h4 class="font-bold text-[#34312D]">${s.name}</h4>
                    <p class="text-xs text-[#81796F]">${s.topics.length} Themen</p>
                  </div>
                `).join('')}
              </div>
            </div>
          `;

        case 'donna':
          return `
            <div class="flex flex-col h-[500px] bg-[#F5F1E8] rounded-2xl border border-[#DED5C8] p-4">
              <div class="flex items-center gap-3 border-b border-[#DED5C8] pb-3 mb-3">
                <div class="w-9 h-9 rounded-full bg-[#C8B69B] flex items-center justify-center text-white font-black text-sm">DP</div>
                <div>
                  <h4 class="text-xs font-bold text-[#34312D]">Donna Paulsen</h4>
                  <p class="text-[10px] text-[#81796F]">Executive Assistant & AI</p>
                </div>
              </div>
              
              <div id="donna-chat-messages" class="flex-1 overflow-y-auto space-y-3 pr-2">
                ${appState.donnaMessages.map(m => `
                  <div class="flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}">
                    <div class="max-w-[80%] p-3 rounded-2xl text-xs ${m.sender === 'user' ? 'bg-[#C8B69B] text-white rounded-br-xs' : 'bg-[#FFFDF8] border border-[#DED5C8] text-[#34312D] rounded-bl-xs'}">
                      ${m.text}
                    </div>
                  </div>
                `).join('')}
              </div>

              <div class="mt-3 flex gap-2">
                <input type="text" id="donna-input" onkeypress="handleDonnaKey(event)" placeholder="Schreibe Donna (z.B. 'Ich habe morgen Hausaufgaben in BWL')..." class="flex-1 bg-[#FFFDF8] border border-[#DED5C8] rounded-xl px-3.5 py-2.5 text-xs">
                <button onclick="sendDonnaMessage()" class="px-4 py-2.5 bg-[#C8B69B] text-white rounded-xl text-xs font-bold">Senden</button>
              </div>
            </div>
          `;

        case 'rechner':
          return `
            <div class="max-w-xs mx-auto space-y-3">
              <input type="text" id="calc-display" readonly value="0" class="w-full bg-[#F5F1E8] border border-[#DED5C8] rounded-xl p-3 text-right text-lg font-mono font-bold">
              <div class="grid grid-cols-4 gap-2">
                <button onclick="calcAppend('7')" class="p-3 bg-[#F5F1E8] rounded-xl font-bold">7</button>
                <button onclick="calcAppend('8')" class="p-3 bg-[#F5F1E8] rounded-xl font-bold">8</button>
                <button onclick="calcAppend('9')" class="p-3 bg-[#F5F1E8] rounded-xl font-bold">9</button>
                <button onclick="calcAppend('/')" class="p-3 bg-[#EAE2D5] rounded-xl font-bold">/</button>
                <button onclick="calcAppend('4')" class="p-3 bg-[#F5F1E8] rounded-xl font-bold">4</button>
                <button onclick="calcAppend('5')" class="p-3 bg-[#F5F1E8] rounded-xl font-bold">5</button>
                <button onclick="calcAppend('6')" class="p-3 bg-[#F5F1E8] rounded-xl font-bold">6</button>
                <button onclick="calcAppend('*')" class="p-3 bg-[#EAE2D5] rounded-xl font-bold">*</button>
                <button onclick="calcAppend('1')" class="p-3 bg-[#F5F1E8] rounded-xl font-bold">1</button>
                <button onclick="calcAppend('2')" class="p-3 bg-[#F5F1E8] rounded-xl font-bold">2</button>
                <button onclick="calcAppend('3')" class="p-3 bg-[#F5F1E8] rounded-xl font-bold">3</button>
                <button onclick="calcAppend('-')" class="p-3 bg-[#EAE2D5] rounded-xl font-bold">-</button>
                <button onclick="calcClear()" class="p-3 bg-red-100 text-red-700 rounded-xl font-bold">C</button>
                <button onclick="calcAppend('0')" class="p-3 bg-[#F5F1E8] rounded-xl font-bold">0</button>
                <button onclick="calcEval()" class="p-3 bg-[#C8B69B] text-white rounded-xl font-bold">=</button>
                <button onclick="calcAppend('+')" class="p-3 bg-[#EAE2D5] rounded-xl font-bold">+</button>
              </div>
            </div>
          `;

        case 'einstellungen':
          return `
            <div class="space-y-6 max-w-xl">
              <h3 class="text-lg font-bold text-[#34312D]">Systemeinstellungen & Cloud Sync</h3>
              
              <div class="p-4 rounded-xl bg-[#F5F1E8] border border-[#DED5C8] space-y-3">
                <h4 class="text-xs font-bold uppercase text-[#81796F]">Supabase Cloud Sync</h4>
                <p class="text-xs text-[#81796F]">Verbinde deine Supabase Datenbank, um Daten geräteübergreifend zu synchronisieren.</p>
                <input type="text" id="supa-url" placeholder="Supabase Project URL" value="${appState.supabase.url}" class="w-full bg-[#FFFDF8] border border-[#DED5C8] rounded-xl px-3 py-2 text-xs">
                <input type="password" id="supa-key" placeholder="Supabase Anon Key" value="${appState.supabase.key}" class="w-full bg-[#FFFDF8] border border-[#DED5C8] rounded-xl px-3 py-2 text-xs">
                <button onclick="saveSupabaseSettings()" class="px-4 py-2 bg-[#C8B69B] text-white rounded-xl text-xs font-bold">Cloud Sync aktivieren</button>
              </div>

              <div class="p-4 rounded-xl bg-[#F5F1E8] border border-[#DED5C8] space-y-3">
                <h4 class="text-xs font-bold uppercase text-[#81796F]">Datensicherung (JSON)</h4>
                <div class="flex gap-2">
                  <button onclick="exportJSON()" class="px-4 py-2 bg-[#C8B69B] text-white rounded-xl text-xs font-bold">Backup exportieren</button>
                  <label class="px-4 py-2 bg-[#EAE2D5] text-[#34312D] rounded-xl text-xs font-bold cursor-pointer border border-[#DED5C8]">
                    Backup importieren <input type="file" accept=".json" onchange="importJSON(event)" class="hidden">
                  </label>
                </div>
              </div>
            </div>
          `;

        default:
          return `<p>App nicht gefunden.</p>`;
      }
    }

    // DONNA AI ASSISTANT NLP PARSER
    function handleDonnaKey(e) { if (e.key === 'Enter') sendDonnaMessage(); }

    function sendDonnaMessage() {
      const input = document.getElementById("donna-input");
      const text = input.value.trim();
      if (!text) return;

      appState.donnaMessages.push({ sender: 'user', text });
      input.value = "";

      // Donna Natural Language Processing (Suits-inspired loyalty & sharpness)
      let donnaReply = "Erledigt, Boss. Ich habe das notiert.";
      const lower = text.toLowerCase();

      if (lower.includes("hausaufgaben") || lower.includes("aufgabe")) {
        appState.tasks.push({ id: Date.now(), title: text, category: "Schule", date: "Heute", completed: false });
        donnaReply = "Ich habe die Aufgabe direkt in deinen Erinnerungen und Aufgaben gespeichert. Auf mich ist eben Verlass.";
      } else if (lower.includes("termin") || lower.includes("klausur") || lower.includes("prüfung")) {
        appState.calendar.push({ id: Date.now(), title: text, date: "Demnächst", type: "Prüfung" });
        donnaReply = "Termin eingetragen. Du musst dir keine Sorgen machen, ich passe auf deinen Kalender auf.";
      } else {
        donnaReply = `Ich habe deine Notiz verstanden. Als deine Assistentin sorge ich dafür, dass alles reibungslos läuft. Gibt es sonst noch etwas, Boss?`;
      }

      appState.donnaMessages.push({ sender: 'donna', text: donnaReply });
      saveLocalStorage();
      
      const chatCont = document.getElementById("donna-chat-messages");
      if (chatCont) {
        chatCont.innerHTML = appState.donnaMessages.map(m => `
          <div class="flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}">
            <div class="max-w-[80%] p-3 rounded-2xl text-xs ${m.sender === 'user' ? 'bg-[#C8B69B] text-white rounded-br-xs' : 'bg-[#FFFDF8] border border-[#DED5C8] text-[#34312D] rounded-bl-xs'}">
              ${m.text}
            </div>
          </div>
        `).join('');
        chatCont.scrollTop = chatCont.scrollHeight;
      }
    }

    // SUPABASE CLOUD SYNC
    let supabaseClient = null;
    function saveSupabaseSettings() {
      const url = document.getElementById("supa-url").value.trim();
      const key = document.getElementById("supa-key").value.trim();
      if (url && key) {
        appState.supabase = { url, key, active: true };
        saveLocalStorage();
        initSupabase();
        alert("Supabase Cloud Sync erfolgreich eingerichtet!");
      }
    }

    function initSupabase() {
      if (appState.supabase.active && window.supabase) {
        supabaseClient = window.supabase.createClient(appState.supabase.url, appState.supabase.key);
        document.getElementById("sync-status-indicator").innerHTML = `<i data-lucide="cloud" class="w-3.5 h-3.5 text-emerald-600"></i><span class="hidden md:inline">Cloud Sync aktiv</span>`;
        lucide.createIcons();
      }
    }

    async function syncWithSupabase() {
      if (!supabaseClient) return;
      try {
        await supabaseClient.from('northstar_sync').upsert({ id: 1, data: appState });
      } catch(e) {
        console.error("Sync error", e);
      }
    }

    // APP UTILS
    function addTaskFromApp() {
      const title = document.getElementById("new-task-input").value.trim();
      if (title) {
        appState.tasks.push({ id: Date.now(), title, category: "Privat", date: "Heute", completed: false });
        saveLocalStorage();
        openApp('aufgaben');
      }
    }

    function toggleTask(id) {
      const t = appState.tasks.find(x => x.id === id);
      if (t) { t.completed = !t.completed; saveLocalStorage(); openApp('aufgaben'); }
    }

    function promptNewNote() {
      const title = prompt("Notiztitel:");
      const content = prompt("Inhalt:");
      if (title) {
        appState.notes.push({ id: Date.now(), title, content: content || "", folder: "Fachabi" });
        saveLocalStorage();
        openApp('finder');
      }
    }

    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `northstar_backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function importJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          appState = JSON.parse(evt.target.result);
          saveLocalStorage();
          openApp('dashboard');
          alert("Backup erfolgreich importiert!");
        } catch(err) { alert("Fehler beim Importieren."); }
      };
      reader.readAsText(file);
    }

    // CALCULATOR
    let calcVal = "";
    function calcAppend(char) { calcVal += char; document.getElementById("calc-display").value = calcVal; }
    function calcClear() { calcVal = ""; document.getElementById("calc-display").value = "0"; }
    function calcEval() { try { calcVal = eval(calcVal).toString(); document.getElementById("calc-display").value = calcVal; } catch(e) { document.getElementById("calc-display").value = "Fehler"; calcVal = ""; } }
  </script>
</body>
</html>
